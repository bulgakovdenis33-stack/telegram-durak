<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Дурак: Подворотня</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }

        body {
            font-family: 'Courier New', Courier, monospace;
            background:
                radial-gradient(circle at 50% 15%, rgba(255, 236, 190, 0.07), transparent 60%),
                radial-gradient(circle at top, #26221d, #0f0d0a);
            color: #d1c7b0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            width: 100%;
            max-width: 700px;
            display: flex;
            justify-content: space-between;
            gap: 10px;
            padding: 14px 16px 4px;
        }

        .badge {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 8px 12px;
            border-radius: 2px;
            font-size: 13px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .main { width: 100%; max-width: 700px; padding: 4px 10px; text-align: center; }

        h1 {
            font-size: 26px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #e0d6c0;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
        }

        .subtitle {
            color: #8a8172;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 8px;
        }

        .row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            min-height: 34px;
        }

        /* ========== КАРТА ========== */
        .card {
            position: relative;
            width: 74px;
            height: 106px;
            border-radius: 10px;
            border: 1px solid rgba(110, 85, 55, 0.6);
            box-shadow:
                0 6px 14px rgba(0, 0, 0, 0.55),
                inset 0 0 14px rgba(96, 66, 32, 0.35),
                inset 0 0 2px rgba(70, 45, 20, 0.5);
            overflow: hidden;
            font-family: Georgia, 'Times New Roman', serif;
            flex: none;
        }

        .card::before {
            content: '';
            position: absolute;
            inset: 0;
            z-index: 3;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='140' height='140' filter='url(%23n)'/></svg>");
            opacity: 0.28;
            mix-blend-mode: multiply;
            pointer-events: none;
        }

        .card::after {
            content: '';
            position: absolute;
            inset: 0;
            z-index: 2;
            background: radial-gradient(circle at 50% 50%, transparent 55%, rgba(88, 60, 28, 0.30) 100%);
            pointer-events: none;
        }

        .card .corner, .card .pip { z-index: 1; }

        .card .corner { position: absolute; line-height: 1; text-align: center; font-weight: bold; }
        .card .corner .rank { font-size: 18px; display: block; }
        .card .corner .suit { font-size: 13px; display: block; margin-top: 2px; }
        .card .corner.top { top: 5px; left: 6px; }
        .card .corner.bottom { bottom: 5px; right: 6px; transform: rotate(180deg); }

        .card .pip {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
        }

        .card.red { color: #8e2b22; }
        .card.black { color: #262019; }

        /* Рубашка карты */
        .card.back {
            background:
                repeating-linear-gradient(45deg, #5a2f22 0 5px, #45231a 5px 10px);
            border-color: rgba(60, 40, 28, 0.9);
        }

        .card.small { width: 42px; height: 60px; border-radius: 6px; }

        /* ========== СТОЛ ========== */
        .tableZone { min-height: 140px; margin: 6px 0; }

        .pair { position: relative; width: 92px; height: 124px; }
        .pair .card { position: absolute; }
        .pair .atk { top: 0; left: 0; }
        .pair .def { top: 18px; left: 18px; }

        .trumpSlot { transform: rotate(90deg); margin: 0 34px; }

        .deckLabel { font-size: 13px; color: #9a917d; text-transform: uppercase; letter-spacing: 1px; }

        /* ========== РУКА ИГРОКА ========== */
        .hand { min-height: 116px; margin-top: 4px; }
        .hand .card { cursor: pointer; }
        .hand .card:active { filter: brightness(1.2); }
        .hand.locked .card { cursor: default; opacity: 0.85; }

        /* ========== КНОПКИ ========== */
        .actions { display: flex; justify-content: center; gap: 10px; margin: 10px 0; }

        .button {
            border: none;
            border-radius: 2px;
            padding: 14px 22px;
            font-size: 15px;
            font-weight: bold;
            font-family: 'Courier New', Courier, monospace;
            color: #e0d6c0;
            background: #3d362d;
            border: 1px solid #221e19;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: 0 4px 0 #1a1612;
        }

        .button:active { transform: translateY(2px); box-shadow: 0 2px 0 #1a1612; }

        .status {
            min-height: 22px;
            color: #9a917d;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        /* ========== ЭКРАН ИТОГА ========== */
        .overlay {
            position: fixed;
            inset: 0;
            z-index: 50;
            background: rgba(5, 4, 3, 0.85);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .overlay.hidden { display: none; }

        .overlay .box {
            text-align: center;
            background: #1d1a16;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 4px;
            padding: 28px 26px;
            max-width: 320px;
        }

        .overlay h2 {
            font-size: 22px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #e0d6c0;
            margin-bottom: 10px;
        }

        .overlay p { color: #9a917d; font-size: 14px; margin-bottom: 18px; }

        @media (max-width: 430px) {
            .card { width: 52px; height: 76px; }
            .card .pip { font-size: 28px; }
            .card .corner .rank { font-size: 13px; }
            .card .corner .suit { font-size: 10px; }
            .card.small { width: 32px; height: 46px; }
            .pair { width: 66px; height: 92px; }
            .pair .def { top: 12px; left: 12px; }
            .trumpSlot { margin: 0 24px; }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="badge" id="player">Игрок: Местный</div>
        <div class="badge" id="balance">Фарт: 100</div>
    </div>

    <div class="main">
        <h1>Дурак</h1>
        <div class="subtitle">Подворотня</div>

        <div class="row" id="botRow"></div>

        <div class="row" id="deckRow"></div>

        <div class="row tableZone" id="tableZone"></div>

        <div class="actions">
            <button class="button" id="btnBito" style="display:none">Отбой</button>
            <button class="button" id="btnTake" style="display:none">Забрать</button>
        </div>

        <div class="status" id="status">...</div>

        <div class="row hand" id="handRow"></div>
    </div>

    <div class="overlay hidden" id="overlay">
        <div class="box">
            <h2 id="overlayTitle">Итог</h2>
            <p id="overlayText"></p>
            <button class="button" id="btnAgain">Сыграть ещё</button>
        </div>
    </div>

        let busy = false;
        let gameOver = false;

            if (!tg || !tg.HapticFeedback) return;
            try {
                if (kind === "success") tg.HapticFeedback.notificationOccurred("success");

        function setStatus(text) { el("status").textContent = text; }

        function renderBalance() { el("balance").textContent = "Фарт: " + fart; }
