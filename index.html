<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Дурак: Подворотня</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }

        body {
            font-family: 'Courier New', Courier, monospace;
            background:
                radial-gradient(circle at 50% 15%, rgba(255, 236, 190, 0.07), transparent 60%),
                radial-gradient(circle at top, #26221d, #0f0d0a);
            color: #d1c7b0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            width: 100%;
            max-width: 700px;
            display: flex;
            justify-content: space-between;
            gap: 10px;
            padding: 14px 16px 4px;
        }

        .badge {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 8px 12px;
            border-radius: 2px;
            font-size: 13px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .main { width: 100%; max-width: 700px; padding: 4px 10px; text-align: center; }

        h1 {
            font-size: 26px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #e0d6c0;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
        }

        .subtitle {
            color: #8a8172;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 8px;
        }

        .row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            min-height: 34px;
        }

        /* ========== КАРТА ========== */
        .card {
            position: relative;
            width: 74px;
            height: 106px;
            border-radius: 10px;
            border: 1px solid rgba(110, 85, 55, 0.6);
            box-shadow:
                0 6px 14px rgba(0, 0, 0, 0.55),
                inset 0 0 14px rgba(96, 66, 32, 0.35),
                inset 0 0 2px rgba(70, 45, 20, 0.5);
            overflow: hidden;
            font-family: Georgia, 'Times New Roman', serif;
            flex: none;
        }

        .card::before {
            content: '';
            position: absolute;
            inset: 0;
            z-index: 3;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='140' height='140' filter='url(%23n)'/></svg>");
            opacity: 0.28;
            mix-blend-mode: multiply;
            pointer-events: none;
        }

        .card::after {
            content: '';
            position: absolute;
            inset: 0;
            z-index: 2;
            background: radial-gradient(circle at 50% 50%, transparent 55%, rgba(88, 60, 28, 0.30) 100%);
            pointer-events: none;
        }

        .card .corner, .card .pip { z-index: 1; }

        .card .corner { position: absolute; line-height: 1; text-align: center; font-weight: bold; }
        .card .corner .rank { font-size: 18px; display: block; }
        .card .corner .suit { font-size: 13px; display: block; margin-top: 2px; }
        .card .corner.top { top: 5px; left: 6px; }
        .card .corner.bottom { bottom: 5px; right: 6px; transform: rotate(180deg); }

        .card .pip {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
        }

        .card.red { color: #8e2b22; }
        .card.black { color: #262019; }

        /* Рубашка карты */
        .card.back {
            background:
                repeating-linear-gradient(45deg, #5a2f22 0 5px, #45231a 5px 10px);
            border-color: rgba(60, 40, 28, 0.9);
        }

        .card.small { width: 42px; height: 60px; border-radius: 6px; }

        /* ========== СТОЛ ========== */
        .tableZone { min-height: 140px; margin: 6px 0; }

        .pair { position: relative; width: 92px; height: 124px; }
        .pair .card { position: absolute; }
        .pair .atk { top: 0; left: 0; }
        .pair .def { top: 18px; left: 18px; }

        .trumpSlot { transform: rotate(90deg); margin: 0 34px; }

        .deckLabel { font-size: 13px; color: #9a917d; text-transform: uppercase; letter-spacing: 1px; }

        /* ========== РУКА ИГРОКА ========== */
        .hand { min-height: 116px; margin-top: 4px; }
        .hand .card { cursor: pointer; }
        .hand .card:active { filter: brightness(1.2); }
        .hand.locked .card { cursor: default; opacity: 0.85; }

        /* ========== КНОПКИ ========== */
        .actions { display: flex; justify-content: center; gap: 10px; margin: 10px 0; }

        .button {
            border: none;
            border-radius: 2px;
            padding: 14px 22px;
            font-size: 15px;
            font-weight: bold;
            font-family: 'Courier New', Courier, monospace;
            color: #e0d6c0;
            background: #3d362d;
            border: 1px solid #221e19;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: 0 4px 0 #1a1612;
        }

        .button:active { transform: translateY(2px); box-shadow: 0 2px 0 #1a1612; }

        .status {
            min-height: 22px;
            color: #9a917d;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        /* ========== ЭКРАН ИТОГА ========== */
        .overlay {
            position: fixed;
            inset: 0;
            z-index: 50;
            background: rgba(5, 4, 3, 0.85);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .overlay.hidden { display: none; }

        .overlay .box {
            text-align: center;
            background: #1d1a16;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 4px;
            padding: 28px 26px;
            max-width: 320px;
        }

        .overlay h2 {
            font-size: 22px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #e0d6c0;
            margin-bottom: 10px;
        }

        .overlay p { color: #9a917d; font-size: 14px; margin-bottom: 18px; }

        @media (max-width: 430px) {
            .card { width: 52px; height: 76px; }
            .card .pip { font-size: 28px; }
            .card .corner .rank { font-size: 13px; }
            .card .corner .suit { font-size: 10px; }
            .card.small { width: 32px; height: 46px; }
            .pair { width: 66px; height: 92px; }
            .pair .def { top: 12px; left: 12px; }
            .trumpSlot { margin: 0 24px; }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="badge" id="player">Игрок: Местный</div>
        <div class="badge" id="balance">Фарт: 100</div>
    </div>

    <div class="main">
        <h1>Дурак</h1>
        <div class="subtitle">Подворотня</div>

        <div class="row" id="botRow"></div>

        <div class="row" id="deckRow"></div>

        <div class="row tableZone" id="tableZone"></div>

        <div class="actions">
            <button class="button" id="btnBito" style="display:none">Отбой</button>
            <button class="button" id="btnTake" style="display:none">Забрать</button>
        </div>

        <div class="status" id="status">...</div>

        <div class="row hand" id="handRow"></div>
    </div>

    <div class="overlay hidden" id="overlay">
        <div class="box">
            <h2 id="overlayTitle">Итог</h2>
            <p id="overlayText"></p>
            <button class="button" id="btnAgain">Сыграть ещё</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
            if (tg.disableVerticalSwipes) tg.disableVerticalSwipes();
        }

        const user = tg?.initDataUnsafe?.user;
        if (user && user.first_name) {
            document.getElementById("player").textContent = "Игрок: " + user.first_name;
        }

        let fart = parseInt(localStorage.getItem("durak_fart") || "100", 10);

        const SUITS = ["♠", "♥", "♦", "♣"];
        const RANKS = ["6", "7", "8", "9", "10", "J", "Q", "K", "A"];
        const VAL = { "6":6, "7":7, "8":8, "9":9, "10":10, "J":11, "Q":12, "K":13, "A":14 };
        const SUIT_COLOR = { "♥": "red", "♦": "red", "♠": "black", "♣": "black" };

        let deck = [], trump = null, trumpCard = null;
        let playerHand = [], botHand = [];
        let table = [];
        let discardCount = 0;
        let attacker = "player";
        let busy = false;
        let gameOver = false;

        const el = (id) => document.getElementById(id);

        function haptic(kind) {
            if (!tg || !tg.HapticFeedback) return;
            try {
                if (kind === "success") tg.HapticFeedback.notificationOccurred("success");
                else if (kind === "error") tg.HapticFeedback.notificationOccurred("error");
                else tg.HapticFeedback.impactOccurred(kind || "medium");
            } catch (e) {}
        }

        function rand(min, max) { return Math.random() * (max - min) + min; }

        function setStatus(text) { el("status").textContent = text; }

        function renderBalance() { el("balance").textContent = "Фарт: " + fart; }

        /* ========== СТАРАЯ БУМАГА ========== */
        function wearBackground() {
            const layers = [];
            const spots = 5 + Math.floor(Math.random() * 4);
            for (let i = 0; i < spots; i++) {
                const x = rand(5, 95).toFixed(1), y = rand(5, 95).toFixed(1);
                const r = rand(5, 18).toFixed(1), a = rand(0.06, 0.26).toFixed(2);
                layers.push(`radial-gradient(circle at ${x}% ${y}%, rgba(112,74,34,${a}) 0%, rgba(112,74,34,0) ${r}%)`);
            }
            for (let i = 0; i < 3; i++) {
                const x = rand(8, 92).toFixed(1), y = rand(8, 92).toFixed(1);
                const r = rand(1.5, 4).toFixed(1);
                layers.push(`radial-gradient(circle at ${x}% ${y}%, rgba(84,48,16,0.5) 0%, rgba(84,48,16,0) ${r}%)`);
            }
            layers.push("linear-gradient(160deg, #ece0c2 0%, #e2d3ae 50%, #d2bf95 100%)");
            return layers.join(",");
        }

        function makeCardEl(card, cls) {
            const d = document.createElement("div");
            d.className = "card " + SUIT_COLOR[card.suit] + (cls ? " " + cls : "");
            d.style.background = wearBackground();
            d.style.transform = "rotate(" + rand(-3, 3).toFixed(1) + "deg)";
            d.innerHTML = `
                <div class="corner top"><span class="rank">${card.rank}</span><span class="suit">${card.suit}</span></div>
                <div class="pip">${card.suit}</div>
                <div class="corner bottom"><span class="rank">${card.rank}</span><span class="suit">${card.suit}</span></div>`;
            return d;
        }

        function makeBackEl() {
            const d = document.createElement("div");
            d.className = "card back small";
            d.style.transform = "rotate(" + rand(-4, 4).toFixed(1) + "deg)";
            return d;
        }

        /* ========== КОЛОДА ========== */
        function newDeck() {
            deck = [];
            for (const s of SUITS) for (const r of RANKS) deck.push({ rank: r, suit: s, value: VAL[r] });
            for (let i = deck.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [deck[i], deck[j]] = [deck[j], deck[i]];
            }
            trumpCard = deck[0];
            trump = trumpCard.suit;
        }

        function drawCard() {
            if (!deck.length) return null;
            return deck.length === 1 ? deck.shift() : deck.pop();
        }

        function refill() {
            const first = attacker === "player" ? playerHand : botHand;
            const second = attacker === "player" ? botHand : playerHand;
            while (first.length < 6) { const c = drawCard(); if (!c) break; first.push(c); }
            while (second.length < 6) { const c = drawCard(); if (!c) break; second.push(c); }
        }

        /* ========== ПРАВИЛА ========== */
        function beats(a, b) {
            return (a.suit === b.suit && a.value > b.value) || (a.suit === trump && b.suit !== trump);
        }

        function undefendedPair() { return table.find(p => !p.defend) || null; }

        function rankOnTable(card) {
            return table.some(p => p.attack.rank === card.rank || (p.defend && p.defend.rank === card.rank));
        }

        function cardCost(c) { return (c.suit === trump ? 100 : 0) + c.value; }

        /* ========== СТАРТ ========== */
        function startGame() {
            newDeck();
            playerHand = []; botHand = []; table = []; discardCount = 0;
            gameOver = false; busy = false;
            refill();

            const pT = Math.min(99, ...playerHand.filter(c => c.suit === trump).map(c => c.value));
            const bT = Math.min(99, ...botHand.filter(c => c.suit === trump).map(c => c.value));
            attacker = bT < pT ? "bot" : "player";

            el("overlay").classList.add("hidden");
            setStatus(attacker === "player" ? "Твой ход. Ходи." : "Соперник ходит. Отбивайся.");
            render();

            if (attacker === "bot") { busy = true; setTimeout(botAttack, 900); }
        }

        /* ========== ХОД ИГРОКА ========== */
        function onPlayerCard(idx) {
            if (busy || gameOver) return;
            const card = playerHand[idx];
            if (!card) return;

            if (attacker === "player") {
                const can = table.length === 0
                    ? true
                    : (rankOnTable(card) && table.length < 6 && botHand.length > 0);
                if (!can) {
                    setStatus("Эту карту подкинуть нельзя.");
                    haptic("error");
                    return;
                }
                playerHand.splice(idx, 1);
                table.push({ attack: card, defend: null });
                haptic("medium");
                busy = true;
                setStatus("Соперник думает...");
                render();
                setTimeout(botDefend, 800);
            } else {
                const p = undefendedPair();
                if (!p) { setStatus("Пока нечего отбивать."); return; }
                if (!beats(card, p.attack)) {
                    setStatus("Не бьёт эту карту.");
                    haptic("error");
                    return;
                }
                playerHand.splice(idx, 1);
                p.defend = card;
                haptic("medium");
                render();
                if (!undefendedPair()) {
                    busy = true;
                    setStatus("Соперник думает...");
                    setTimeout(botAttack, 900);
                }
            }
        }

        /* ========== БОТ ========== */
        function botDefend() {
            const p = undefendedPair();
            if (!p) { busy = false; render(); return; }

            const options = botHand.filter(c => beats(c, p.attack)).sort((a, b) => cardCost(a) - cardCost(b));

            if (options.length) {
                const c = options[0];
                botHand.splice(botHand.indexOf(c), 1);
                p.defend = c;
                busy = false;
                setStatus("Отбился. Подкидывай или жми «Отбой».");
                render();
            } else {
                for (const pair of table) {
                    botHand.push(pair.attack);
                    if (pair.defend) botHand.push(pair.defend);
                }
                table = [];
                haptic("success");
                setStatus("Соперник забирает. Фарту.");
                endBout("bot");
            }
        }

        function botAttack() {
            if (gameOver) return;

            let choice = null;
            const pool = botHand.slice().sort((a, b) => cardCost(a) - cardCost(b));

            if (table.length === 0) {
                choice = pool[0] || null;
            } else {
                const matching = pool.filter(c => rankOnTable(c));
                if (matching.length && matching[0].value <= 10) choice = matching[0];
            }

            const canPlace = choice && table.length < 6 && playerHand.length > 0;

            if (canPlace) {
                botHand.splice(botHand.indexOf(choice), 1);
                table.push({ attack: choice, defend: null });
                busy = false;
                setStatus(table.length === 1 ? "Соперник ходит. Отбивайся." : "Подкидывает. Отбивайся.");
                render();
            } else {
                setStatus("Отбой.");
                endBout(null);
            }
        }

        /* ========== КОНЕЦ РАУНДА ========== */
        function endBout(taker) {
            const cards = [];
            for (const p of table) {
                cards.push(p.attack);
                if (p.defend) cards.push(p.defend);
            }
            table = [];

            if (taker) {
                (taker === "player" ? playerHand : botHand).push(...cards);
            } else {
                discardCount += cards.length;
                attacker = attacker === "player" ? "bot" : "player";
            }

            refill();
            busy = false;

            const pEmpty = playerHand.length === 0;
            const bEmpty = botHand.length === 0;

            if (deck.length === 0 && (pEmpty || bEmpty)) {
                gameOver = true;
                if (pEmpty && bEmpty) finish("draw");
                else if (pEmpty) finish("win");
                else finish("loss");
                return;
            }

            render();

            if (attacker === "player") {
                setStatus("Твой ход. Ходи.");
            } else {
                busy = true;
                setStatus("Соперник ходит. Отбивайся.");
                render();
                setTimeout(botAttack, 900);
            }
        }

        function finish(result) {
            gameOver = true;
            busy = false;

            let title, delta = 0;
            if (result === "win") { title = "Фартануло. Ты не дурак."; delta = 10; haptic("success"); }
            else if (result === "loss") { title = "Ты дурак. Бывает."; delta = -5; haptic("error"); }
            else { title = "Ничья. Раздали поровну."; }

            fart = Math.max(0, fart + delta);
            localStorage.setItem("durak_fart", String(fart));
            renderBalance();

            el("overlayTitle").textContent = title;
            el("overlayText").textContent = delta > 0 ? ("+" + delta + " к фарту") : (delta < 0 ? (delta + " к фарту") : "Фарт не изменился");
            el("overlay").classList.remove("hidden");
            render();
        }

        /* ========== КНОПКИ ========== */
        el("btnBito").addEventListener("click", () => {
            if (busy || gameOver) return;
            if (attacker === "player" && table.length > 0 && !undefendedPair()) {
                setStatus("Отбой.");
                endBout(null);
            }
        });

        el("btnTake").addEventListener("click", () => {
            if (busy || gameOver) return;
            if (attacker === "bot" && table.length > 0) {
                for (const p of table) {
                    playerHand.push(p.attack);
                    if (p.defend) playerHand.push(p.defend);
                }
                table = [];
                haptic("error");
                setStatus("Твоя взяла... в карты.");
                endBout("player");
            }
        });

        el("btnAgain").addEventListener("click", startGame);

        /* ========== ОТРИСОВКА ========== */
        function render() {
            renderBalance();

            const botRow = el("botRow");
            botRow.innerHTML = "";
            const showBacks = Math.min(botHand.length, 8);
            for (let i = 0; i < showBacks; i++) botRow.appendChild(makeBackEl());
            const botLabel = document.createElement("div");
            botLabel.className = "deckLabel";
            botLabel.textContent = "Соперник: " + botHand.length;
            botRow.appendChild(botLabel);

            const deckRow = el("deckRow");
            deckRow.innerHTML = "";
            const deckLabel = document.createElement("div");
            deckLabel.className = "deckLabel";
            deckLabel.textContent = "Колода: " + deck.length;
            deckRow.appendChild(deckLabel);

            if (deck.length > 0) {
                const slot = document.createElement("div");
                slot.className = "trumpSlot";
                slot.appendChild(makeCardEl(trumpCard, "small"));
                deckRow.appendChild(slot);
            } else {
                const t = document.createElement("div");
                t.className = "deckLabel";
                t.textContent = "Козырь: " + trump;
                deckRow.appendChild(t);
            }

            const tableZone = el("tableZone");
            tableZone.innerHTML = "";
            for (const p of table) {
                const pair = document.createElement("div");
                pair.className = "pair";
                const atk = makeCardEl(p.attack);
                atk.classList.add("atk");
                pair.appendChild(atk);
                if (p.defend) {
                    const def = makeCardEl(p.defend);
                    def.classList.add("def");
                    pair.appendChild(def);
                }
                tableZone.appendChild(pair);
            }

            const handRow = el("handRow");
            handRow.innerHTML = "";
            handRow.classList.toggle("locked", busy || gameOver || attacker === "bot" && !undefendedPair() === false ? busy || gameOver : busy || gameOver);
            playerHand.forEach((card, i) => {
                const c = makeCardEl(card);
                c.addEventListener("click", () => onPlayerCard(i));
                handRow.appendChild(c);
            });

            el("btnBito").style.display =
                (!busy && !gameOver && attacker === "player" && table.length > 0 && !undefendedPair()) ? "" : "none";
            el("btnTake").style.display =
                (!busy && !gameOver && attacker === "bot" && table.length > 0) ? "" : "none";
        }

        startGame();
    </script>
</body>
</html>
